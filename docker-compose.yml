version: '3.9'

services:

  ai-service:
    build: ./ai_service
    container_name: ai_service_container
    ports:
      - "5000:5000"
    env_file:
      - .env

  backend:
    build: ./backend
    container_name: backend_container
    ports:
      - "8080:8080"
    depends_on:
      - ai-service